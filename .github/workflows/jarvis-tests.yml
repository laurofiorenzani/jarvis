name: Jarvis tests

on:
  push:
    branches:
      - work/memory-integration
    paths:
      - 'bridge/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/jarvis-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'bridge/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/jarvis-tests.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: node --check bridge/memory-backup.mjs
      - run: node --check scripts/memory-backup.mjs
      - run: npm test
      - name: Verify disposable Windows Credential Manager diagnostic
        if: runner.os == 'Windows'
        run: npm run memory:doctor
      - run: npm run build

  lockfile:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate and commit lockfile safely
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            npm install --package-lock-only --ignore-scripts
            if git diff --quiet -- package-lock.json; then exit 0; fi
            git add package-lock.json
            git commit -m 'Update package lockfile for memory vault dependency'
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          echo 'Could not publish generated package-lock.json after three attempts' >&2
          exit 1
