name: Commit validated dependency lock

on:
  push:
    branches:
      - work/jarvis-amber-production-track

permissions:
  actions: read
  contents: write

jobs:
  commit-lock:
    if: contains(github.event.head_commit.message, '[commit-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Download lockfile from successful validation run
        uses: actions/download-artifact@v4
        with:
          name: jarvis-validated-package-lock
          run-id: 43282871493
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/validated-lock
      - name: Verify and commit validated lockfile
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node -e "const l=require('/tmp/validated-lock/package-lock.json'); if(l.packages?.['node_modules/@huggingface/transformers']?.version!=='4.3.2'||l.packages?.['node_modules/sharp']?.version!=='0.35.5') process.exit(1)"
          cp /tmp/validated-lock/package-lock.json package-lock.json
          rm .github/workflows/commit-validated-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/commit-validated-lock.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(deps): persist validated security lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
