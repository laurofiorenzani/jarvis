name: JARVIS Read-only System Observer

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: ["main", "work/self-evolution-readonly-observer", "work/jarvis-canonical-integration"]

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: jarvis-readonly-observer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Observe public service health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production cloud API health
        env:
          JARVIS_API_URL: https://undmhmdwhxvjgvezvucy.supabase.co/functions/v1/jarvis-api/health
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.JARVIS_API_URL;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          try {
            const response = await fetch(url, {
              method: 'GET',
              headers: { accept: 'application/json' },
              signal: controller.signal,
              redirect: 'error',
            });
            const payload = response.ok ? await response.json().catch(() => null) : null;
            const healthy = response.ok && payload?.status === 'ok';
            console.log(JSON.stringify({
              signal: 'production_api_http',
              status: response.status,
              healthy,
              observedAt: new Date().toISOString(),
            }));
            if (!healthy) process.exitCode = 1;
          } finally {
            clearTimeout(timer);
          }
          NODE

      - name: Check canonical Preview cloud API health
        env:
          JARVIS_PREVIEW_API_URL: https://undmhmdwhxvjgvezvucy.supabase.co/functions/v1/jarvis-preview-api/health
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.JARVIS_PREVIEW_API_URL;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          try {
            const response = await fetch(url, {
              method: 'GET',
              headers: { accept: 'application/json' },
              signal: controller.signal,
              redirect: 'error',
            });
            const payload = response.ok ? await response.json().catch(() => null) : null;
            const healthy = response.ok && payload?.status === 'ok';
            console.log(JSON.stringify({
              signal: 'canonical_preview_api_http',
              status: response.status,
              healthy,
              observedAt: new Date().toISOString(),
            }));
            if (!healthy) process.exitCode = 1;
          } finally {
            clearTimeout(timer);
          }
          NODE

      - name: Check production PWA availability
        env:
          JARVIS_PWA_URL: https://jarvis-lauro-fiorenzani.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.JARVIS_PWA_URL;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          try {
            const response = await fetch(url, {
              method: 'GET',
              headers: { accept: 'text/html' },
              signal: controller.signal,
              redirect: 'error',
            });
            const healthy = response.ok && (response.headers.get('content-type') || '').includes('text/html');
            console.log(JSON.stringify({
              signal: 'production_pwa_http',
              status: response.status,
              contentType: response.headers.get('content-type'),
              healthy,
              observedAt: new Date().toISOString(),
            }));
            if (!healthy) process.exitCode = 1;
          } finally {
            clearTimeout(timer);
          }
          NODE

      - name: Observe latest repository CI metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const canonicalBranch = encodeURIComponent('work/jarvis-canonical-integration');
          const endpoint = `${process.env.GH_API_URL}/repos/${process.env.GH_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${canonicalBranch}&event=push&per_page=1`;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          try {
            const response = await fetch(endpoint, {
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                'x-github-api-version': '2022-11-28',
              },
              signal: controller.signal,
              redirect: 'error',
            });
            if (!response.ok) throw new Error(`GitHub CI metadata request failed: HTTP ${response.status}`);
            const payload = await response.json();
            const run = Array.isArray(payload.workflow_runs) ? payload.workflow_runs[0] : undefined;
            let status = 'unknown';
            if (run?.status !== 'completed' && run?.status) status = 'running';
            else if (run?.conclusion === 'success') status = 'healthy';
            else if (run?.conclusion === 'failure' || run?.conclusion === 'timed_out') status = 'failed';
            else if (run?.conclusion) status = 'degraded';
            console.log(JSON.stringify({
              signal: 'latest_repository_ci',
              source: 'ci',
              status,
              runNumber: Number.isInteger(run?.run_number) ? run.run_number : undefined,
              observedAt: new Date().toISOString(),
            }));
          } finally {
            clearTimeout(timer);
          }
          NODE

      - name: Observe latest Vercel deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const api = process.env.GH_API_URL;
          const repository = process.env.GH_REPOSITORY;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'x-github-api-version': '2022-11-28',
          };
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          try {
            const branchUrl = `${api}/repos/${repository}/branches/${encodeURIComponent('work/jarvis-canonical-integration')}`;
            const branchResponse = await fetch(branchUrl, {
              headers, signal: controller.signal, redirect: 'error',
            });
            if (!branchResponse.ok) throw new Error(`GitHub canonical branch request failed: HTTP ${branchResponse.status}`);
            const branchPayload = await branchResponse.json();
            const sha = branchPayload.commit?.sha;
            if (typeof sha !== 'string' || !/^[a-f0-9]{40}$/i.test(sha)) {
              throw new Error('GitHub canonical branch response did not contain a valid commit SHA.');
            }

            const statusUrl = `${api}/repos/${repository}/commits/${sha}/status`;
            const statusResponse = await fetch(statusUrl, {
              headers, signal: controller.signal, redirect: 'error',
            });
            if (!statusResponse.ok) throw new Error(`GitHub commit status request failed: HTTP ${statusResponse.status}`);
            const payload = await statusResponse.json();
            const statuses = Array.isArray(payload.statuses) ? payload.statuses : [];
            const vercel = statuses
              .filter((item) => item?.context === 'Vercel')
              .sort((left, right) => Date.parse(right.updated_at || '') - Date.parse(left.updated_at || ''))[0];
            const status = vercel?.state === 'success' ? 'healthy'
              : vercel?.state === 'pending' ? 'running'
                : vercel?.state === 'failure' || vercel?.state === 'error' ? 'failed'
                  : 'unknown';
            console.log(JSON.stringify({
              signal: 'latest_vercel_deployment',
              source: 'deployment',
              status,
              observedAt: new Date().toISOString(),
            }));
            if (status === 'failed' || status === 'unknown') process.exitCode = 1;
          } finally {
            clearTimeout(timer);
          }
          NODE
