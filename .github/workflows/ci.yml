name: CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency security advisories
        continue-on-error: true
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const r=require("./npm-audit.json"); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via || []).map(x => typeof x === "string" ? x : {title:x.title,url:x.url,range:x.range})}))'

      - name: Apply non-breaking dependency security fixes for validation
        shell: bash
        run: |
          npm audit fix || true
          npm audit --json > npm-audit-after.json || true
          node -e 'const r=require("./npm-audit-after.json"); console.log(JSON.stringify(r.metadata?.vulnerabilities || r.error || {})); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))'

      - name: Commit validated dependency lockfile updates
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: apply compatible npm security updates"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload validated security-updated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-security-updated-lockfile
          path: package-lock.json
          if-no-files-found: error

      - name: Typecheck and production build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/jarvis-api/index.ts
