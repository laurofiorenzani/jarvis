name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency security advisories
        continue-on-error: true
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const r=require("./npm-audit.json"); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via || []).map(x => typeof x === "string" ? x : {title:x.title,url:x.url,range:x.range})}))'

      - name: Apply non-breaking dependency security fixes for validation
        shell: bash
        run: |
          npm audit fix || true
          npm audit --json > npm-audit-after.json || true
          node -e 'const r=require("./npm-audit-after.json"); console.log(JSON.stringify(r.metadata?.vulnerabilities || r.error || {})); for (const [name,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))'
          npm run audit

      - name: Upload validated security-updated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-security-updated-lockfile
          path: package-lock.json
          if-no-files-found: error

      - name: Typecheck and production build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test provider privacy routing
        run: deno test supabase/functions/jarvis-api/model-router_test.ts

      - name: Test semantic-memory validation and auto-capture policy
        run: deno test supabase/functions/jarvis-api/semantic-memory.deno.ts

      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/jarvis-api/index.ts

      - name: Test speech transcript extraction and empty-response handling
        run: deno test supabase/functions/jarvis-api/speech-transcript_test.ts

      - name: Set up Supabase CLI
        id: setup_supabase_cli
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Start isolated local Supabase database
        run: supabase start --exclude mailpit

      - name: Apply migrations to isolated local database
        run: supabase db reset

      - name: Run SQL isolation regression tests
        run: supabase test db

      - name: Test authenticated semantic memory API with two isolated users
        shell: bash
        run: |
          set -euo pipefail
          supabase functions serve jarvis-api --no-verify-jwt > /tmp/jarvis-functions.log 2>&1 &
          functions_pid=$!
          trap 'kill "$functions_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:54321/functions/v1/jarvis-api/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/jarvis-functions.log
            exit 1
          fi
          supabase status -o env > /tmp/jarvis-supabase.env
          set -a
          source /tmp/jarvis-supabase.env
          set +a
          JARVIS_TEST_SUPABASE_URL="$API_URL" \
          JARVIS_TEST_ANON_KEY="$ANON_KEY" \
          JARVIS_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node scripts/test-semantic-memory-integration.mjs

      - name: Stop isolated local Supabase stack
        if: always() && steps.setup_supabase_cli.outcome == 'success'
        shell: bash
        run: |
          if ! supabase stop --no-backup; then
            echo "::warning::Local Supabase teardown failed after the database and authenticated API checks completed; the ephemeral GitHub runner will reclaim remaining containers."
          fi

      - name: Smoke-test deployed cloud API and production CORS
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://undmhmdwhxvjgvezvucy.supabase.co/functions/v1/jarvis-api"
          apikey="$(sed -nE "s/.*supabasePublishableKey:.*'([^']+)'.*/\\1/p" src/config.ts | head -n 1)"
          test -n "$apikey"
          health="$(curl --fail --silent --show-error "$endpoint/health" --header "apikey: $apikey")"
          grep -q '"status":"ok"' <<< "$health"
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS "$endpoint/provider-status" \
            --header "apikey: $apikey" \
            --header "Origin: https://jarvis-lauro-fiorenzani.vercel.app" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: apikey,authorization,x-jarvis-api-version")"
          grep -Fqi "access-control-allow-origin: https://jarvis-lauro-fiorenzani.vercel.app" <<< "$headers"
          grep -Eqi "access-control-allow-headers:.*apikey" <<< "$headers"

      - name: Smoke-test canonical integration preview CORS
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://undmhmdwhxvjgvezvucy.supabase.co/functions/v1/jarvis-preview-api"
          apikey="$(sed -nE "s/.*supabasePublishableKey:.*'([^']+)'.*/\\1/p" src/config.ts | head -n 1)"
          test -n "$apikey"
          headers="$(curl --silent --show-error --dump-header - --output /dev/null --request OPTIONS "$endpoint/provider-status" \
            --header "apikey: $apikey" \
            --header "Origin: https://jarvis-git-work-jarvis-canonical-integration-lauro-fiorenzani.vercel.app" \
            --header "Access-Control-Request-Method: GET" \
            --header "Access-Control-Request-Headers: apikey,authorization,x-jarvis-api-version,x-region")"
          grep -Fqi "access-control-allow-origin: https://jarvis-git-work-jarvis-canonical-integration-lauro-fiorenzani.vercel.app" <<< "$headers"
