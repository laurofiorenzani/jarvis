name: Jarvis preview validation

on:
  push:
    branches:
      - work/jarvis-amber-production-track
      - work/jarvis-voice-locale
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  statuses: write

concurrency:
  group: jarvis-preview-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched transitive dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high
      - name: TypeScript and production build
        run: npm run build
      - name: Unit and regression tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function typecheck
        run: deno check --config supabase/functions/jarvis-api/deno.json supabase/functions/jarvis-api/index.ts
      - name: Preview Edge Function typecheck
        run: deno check --config supabase/functions/jarvis-preview-api/deno.json supabase/functions/jarvis-preview-api/index.ts
      - name: Edge Function tests
        run: deno test --config supabase/functions/jarvis-api/deno.json supabase/functions/jarvis-api/semantic-memory.deno.ts
      - name: Preview Edge Function tests
        run: deno test --config supabase/functions/jarvis-preview-api/deno.json supabase/functions/jarvis-preview-api/semantic-memory.deno.ts
      - name: Upload validated dependency lockfile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-validated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Commit validated dependency lockfile
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/work/jarvis-amber-production-track'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const branch = 'work/jarvis-amber-production-track'
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })
            if (ref.data.object.sha !== context.sha) {
              core.warning('Branch advanced during validation; skipping dependency lockfile commit.')
              return
            }
            const file = await github.rest.repos.getContent({ owner, repo, path: 'package-lock.json', ref: branch })
            const existing = Buffer.from(file.data.content.replace(/\\n/g, ''), 'base64')
            const updated = fs.readFileSync('package-lock.json')
            if (existing.equals(updated)) {
              core.info('Committed package-lock.json already matches the tested dependency tree.')
              return
            }
            const saved = await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'package-lock.json', branch, sha: file.data.sha,
              message: 'fix(deps): commit zero-vulnerability tested lockfile',
              content: updated.toString('base64'),
            })
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: saved.data.commit.sha, state: 'success', context: 'JARVIS CI',
              description: 'Dependency lockfile was validated with zero npm vulnerabilities',
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            })
            core.info(`Committed validated dependency lockfile: ${saved.data.commit.sha}`)
      - name: Publish commit validation status
        if: always()
        uses: actions/github-script@v8
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'JARVIS CI',
              description: state === 'success' ? 'Build, tests, lint and Deno checks passed' : 'One or more validation steps failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
