name: Jarvis preview validation

on:
  push:
    branches:
      - work/jarvis-amber-production-track
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  statuses: write

concurrency:
  group: jarvis-preview-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency security advisories
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log('npm audit summary:', JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log(name, JSON.stringify({severity:item.severity,isDirect:item.isDirect,range:item.range,fixAvailable:item.fixAvailable}))"
      - name: Resolve compatible npm security fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Install patched dependency tree
        run: npm ci
      - name: Report remaining npm advisories
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-after.json || true
          node -e "const r=require('./npm-audit-after.json'); console.log('patched npm audit summary:', JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log(name, JSON.stringify({severity:item.severity,isDirect:item.isDirect,range:item.range,fixAvailable:item.fixAvailable}))"
      - name: Upload dependency refresh candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-dependency-refresh-candidate
          path: |
            package-lock.json
            npm-audit-after.json
          if-no-files-found: warn
      - name: TypeScript and production build
        run: npm run build
      - name: Unit and regression tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function typecheck
        run: deno check --config supabase/functions/jarvis-api/deno.json supabase/functions/jarvis-api/index.ts
      - name: Preview Edge Function typecheck
        run: deno check --config supabase/functions/jarvis-preview-api/deno.json supabase/functions/jarvis-preview-api/index.ts
      - name: Edge Function tests
        run: deno test --config supabase/functions/jarvis-api/deno.json supabase/functions/jarvis-api/semantic-memory.deno.ts
      - name: Preview Edge Function tests
        run: deno test --config supabase/functions/jarvis-preview-api/deno.json supabase/functions/jarvis-preview-api/semantic-memory.deno.ts
      - name: Publish commit validation status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'JARVIS CI',
              description: state === 'success' ? 'Build, tests, lint and Deno checks passed' : 'One or more validation steps failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
