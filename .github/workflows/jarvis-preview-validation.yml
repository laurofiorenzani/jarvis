name: Jarvis preview validation

on:
  push:
    branches:
      - work/jarvis-amber-production-track
  pull_request:
    branches:
      - main
      - work/jarvis-amber-production-track

permissions:
  contents: read

concurrency:
  group: jarvis-preview-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Unit and regression tests
        run: npm test
      - name: Lint
        run: npm run lint
