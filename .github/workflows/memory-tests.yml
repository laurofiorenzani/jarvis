name: Jarvis memory tests

on:
  push:
    branches:
      - feature/intelligent-memory
  pull_request:
    branches:
      - main
      - feature/intelligent-memory

jobs:
  memory-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Build application
        run: npm run build
